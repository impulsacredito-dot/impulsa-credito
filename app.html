<!DOCTYPE html>
<html lang="es-PE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma — Impulsa Crédito</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="app-body">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<aside class="sidebar" id="sidebar">
  <a href="#/inicio" class="sb-brand"><span class="brand-lockup"><img class="bl-mark js-brand-mark" src="assets/logo-icon.png" alt=""><span class="bl-text"><span class="bl-name">Impulsa <b>Crédito</b></span><span class="bl-tag">Asesoría y Gestión Crediticia</span></span></span></a>
  <div class="sb-user">
    <div class="avatar" id="sbAvatar">U</div>
    <div><b id="sbName">Usuario</b><span id="sbDoc"></span></div>
  </div>
  <nav class="sb-nav" id="sbNav"></nav>
  <button class="sb-logout" id="logoutBtn">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17l5-5-5-5M15 12H3M21 3v18"/></svg>
    Cerrar sesión
  </button>
</aside>

<div class="app-main">
  <header class="topbar">
    <div class="row">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menú">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div><h1 id="pageTitle">Inicio</h1><div class="date" id="pageDate"></div></div>
    </div>
    <div class="topbar-right">
      <div class="user-pill"><div class="avatar sm" id="tbAvatar">U</div><span id="tbName">USUARIO</span></div>
      <button class="icon-btn" id="bellBtn" aria-label="Notificaciones">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="n hidden" id="bellCount">0</span>
      </button>
    </div>
  </header>
  <main class="view" id="view"></main>
</div>

<script src="js/config.js"></script>
<script src="js/app-core.js"></script>
<script src="js/backend.js"></script>
<script src="js/app.js"></script>
</body>
</html>
