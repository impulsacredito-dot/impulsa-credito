<!DOCTYPE html>
<html lang="es-PE">
<head>
<meta charset="UTF-8">
<title>Piezas de redes — Impulsa Crédito</title>
<!--
  =====================================================================
  IMPULSA CRÉDITO — Piezas para Instagram y TikTok
  =====================================================================
  Cada imagen de las redes sale de esta página.

  VER TODAS:      abre  redes-sociales/piezas.html?p=todo
  VER UNA:        abre  redes-sociales/piezas.html?p=ig-01
  EXPORTAR TODO:  clic derecho en exportar.ps1 → "Ejecutar con PowerShell"
                  (deja las imágenes listas en redes-sociales/exportadas/)

  LAS DOS LÍNEAS DE LA MARCA
    Asesoría (la principal): préstamos para negocios y personas.
                             Fondos negros y claros.
    Efectiviza:              tarjeta de crédito a efectivo.
                             Fondo verde, siempre en la columna derecha
                             del perfil.

  El número de WhatsApp, el horario, la comisión y los montos se leen de
  js/config.js: si cambian allí, basta con volver a exportar.
  El usuario de las redes se cambia en la variable USUARIO, más abajo.
  =====================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=block" rel="stylesheet">
<style>
:root{
  --g:#22c55e; --gd:#16a34a; --gl:#4ade80;
  --k:#111111; --ink:#08130c;
  --s:#f6f9f7; --t:#10151a; --m:#5b6b63;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#1d2220}
body{font-family:'Montserrat',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

/* ---------- lienzo ---------- */
.pz{position:relative;overflow:hidden;color:#fff;font-family:'Montserrat',sans-serif}
.pz.dark{background:
  radial-gradient(70% 50% at 100% 0%, rgba(34,197,94,.30) 0%, rgba(34,197,94,0) 70%),
  radial-gradient(60% 40% at 0% 100%, rgba(34,197,94,.16) 0%, rgba(34,197,94,0) 70%),
  linear-gradient(160deg,#0f1412 0%,#0b0e0d 100%)}
.pz.green{color:var(--ink);background:
  radial-gradient(70% 55% at 100% 0%, #4ade80 0%, rgba(74,222,128,0) 70%),
  radial-gradient(60% 45% at 0% 100%, #16a34a 0%, rgba(22,163,74,0) 70%),
  var(--g)}
.pz.light{color:var(--t);background:
  radial-gradient(60% 40% at 100% 0%, rgba(34,197,94,.14) 0%, rgba(34,197,94,0) 70%),
  var(--s)}

/* zona de contenido segura */
.c{position:absolute;inset:112px 96px 200px 96px;display:flex;flex-direction:column}
.c.mid{justify-content:center}
.c.end{justify-content:flex-end}
.st .c{inset:250px 96px 360px 96px}

/* decoración */
.agua{position:absolute;pointer-events:none;opacity:.07}
.rombos{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* ---------- tipografía ---------- */
.eyebrow{display:flex;align-items:center;gap:18px;font-size:27px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;color:var(--gl)}
.eyebrow:before{content:"";width:46px;height:4px;border-radius:4px;background:var(--g);flex:none}
.green .eyebrow{color:var(--ink)} .green .eyebrow:before{background:var(--ink)}
.light .eyebrow{color:var(--gd)}

.t{font-weight:900;letter-spacing:-.045em;line-height:.98}
.t1{font-size:148px} .t2{font-size:118px} .t3{font-size:96px} .t4{font-size:78px} .t5{font-size:64px}
.hl{display:inline-block;background:var(--g);color:var(--ink);padding:0 .13em .05em;border-radius:.15em;line-height:1.04}
.green .hl{background:var(--k);color:var(--gl)}
.verde{color:var(--gl)} .green .verde{color:#fff} .light .verde{color:var(--gd)}

.lead{font-size:40px;font-weight:500;line-height:1.38;color:rgba(255,255,255,.78)}
.green .lead{color:rgba(8,19,12,.84)} .light .lead{color:var(--m)}
.lead b{font-weight:800;color:#fff} .green .lead b{color:var(--ink)} .light .lead b{color:var(--t)}
.mt-s{margin-top:28px} .mt-m{margin-top:48px} .mt-l{margin-top:72px} .auto{margin-top:auto}

/* ---------- componentes ---------- */
.chips{display:flex;flex-wrap:wrap;gap:16px}
.chip{display:inline-flex;align-items:center;gap:12px;font-size:28px;font-weight:700;padding:16px 26px;border-radius:999px;border:2px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);white-space:nowrap}
.chip svg{color:var(--g);flex:none}
.green .chip{border-color:rgba(8,19,12,.22);background:rgba(8,19,12,.06)} .green .chip svg{color:var(--ink)}
.light .chip{border-color:rgba(16,21,26,.12);background:#fff} .light .chip svg{color:var(--gd)}

.boton{display:inline-flex;align-items:center;gap:16px;align-self:flex-start;background:var(--g);color:var(--ink);font-weight:800;font-size:36px;padding:28px 44px;border-radius:999px;box-shadow:0 18px 40px -14px rgba(34,197,94,.7)}
.green .boton{background:var(--k);color:#fff;box-shadow:0 18px 40px -14px rgba(0,0,0,.5)}
.green .boton svg{color:var(--gl)}

.desliza{position:absolute;right:96px;bottom:200px;display:inline-flex;align-items:center;gap:12px;font-size:28px;font-weight:800;letter-spacing:.04em;padding:16px 26px;border-radius:999px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.16)}
.desliza svg{color:var(--g)}
.light .desliza{background:#fff;border-color:rgba(16,21,26,.12)} .light .desliza svg{color:var(--gd)}

.pag{position:absolute;top:112px;right:96px;font-size:28px;font-weight:800;letter-spacing:.08em;opacity:.55}

/* firma de marca (pie de cada pieza) */
.firma{position:absolute;left:96px;right:96px;bottom:76px;display:flex;align-items:center;justify-content:space-between}
.fm-logo{display:flex;align-items:center;gap:16px}
.fm-logo img{height:62px}
.fm-logo b{font-size:33px;font-weight:800;letter-spacing:-.02em}
.fm-logo b em{font-style:normal;color:var(--g)}
.fm-handle{font-size:28px;font-weight:600;opacity:.66}
.green .firma{left:64px;right:64px;bottom:56px;background:var(--k);color:#fff;border-radius:30px;padding:22px 32px}
.green .fm-logo img{height:56px}
.light .fm-logo b em{color:var(--gd)}
.st .firma{bottom:150px}
.st.green .firma{bottom:130px}

/* tarjeta oscura (simulador) */
.caja{background:#0f1412;color:#fff;border-radius:40px;padding:48px 52px;box-shadow:0 40px 80px -30px rgba(0,0,0,.55)}
.fila{display:flex;justify-content:space-between;align-items:baseline;font-size:36px;font-weight:600;color:rgba(255,255,255,.72);padding:18px 0}
.fila b{color:#fff;font-weight:800;font-size:44px}
.fila.menos b{color:rgba(255,255,255,.72)}
.linea{height:2px;background:rgba(255,255,255,.12);margin:14px 0 22px}
.recibes span{display:block;font-size:30px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gl)}
.recibes b{display:block;font-size:136px;font-weight:900;letter-spacing:-.05em;line-height:1;color:var(--gl);margin-top:12px}

/* lista con iconos */
.lista{display:flex;flex-direction:column;gap:26px}
.item{display:flex;align-items:center;gap:30px;padding:30px 34px;border-radius:30px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.10)}
.item .ico{flex:none;width:92px;height:92px;border-radius:26px;display:grid;place-items:center;background:rgba(34,197,94,.14);color:var(--gl)}
.item .ico.no{background:rgba(255,255,255,.08);color:#fff}
.item .ico.n{font-size:44px;font-weight:900}
.item h4{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.item p{font-size:29px;font-weight:500;color:rgba(255,255,255,.66);margin-top:6px;line-height:1.3}
.light .item{background:#fff;border-color:rgba(16,21,26,.08);box-shadow:0 20px 40px -28px rgba(16,21,26,.35)}
.light .item .ico{background:rgba(34,197,94,.14);color:var(--gd)}
.light .item .ico.no{background:rgba(16,21,26,.07);color:var(--t)}
.light .item p{color:var(--m)}
.green .item{background:rgba(8,19,12,.07);border-color:rgba(8,19,12,.14)}
.green .item .ico{background:var(--k);color:var(--gl)}
.green .item p{color:rgba(8,19,12,.72)}

/* pasos */
.pasos{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.paso{border-radius:28px;padding:28px 22px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.10)}
.paso b{display:block;font-size:46px;font-weight:900;color:var(--g);letter-spacing:-.03em}
.paso span{display:block;font-size:25px;font-weight:700;line-height:1.25;margin-top:10px;color:rgba(255,255,255,.86)}
.light .paso{background:#fff;border-color:rgba(16,21,26,.08);box-shadow:0 20px 40px -28px rgba(16,21,26,.35)}
.light .paso b{color:var(--gd)} .light .paso span{color:var(--t)}
.num-gigante{font-size:400px;font-weight:900;letter-spacing:-.07em;line-height:.82;color:transparent;background:linear-gradient(180deg,#4ade80 0%,rgba(34,197,94,.08) 92%);-webkit-background-clip:text;background-clip:text;align-self:flex-start;padding-right:.05em}
.light .num-gigante{background-image:linear-gradient(180deg,#16a34a 0%,rgba(22,163,74,.08) 92%)}
.puntos{display:flex;gap:12px}
.puntos i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.18)}
.puntos i.on{width:52px;border-radius:12px;background:var(--g)}
.light .puntos i{background:rgba(16,21,26,.14)} .light .puntos i.on{background:var(--gd)}

/* comparación */
.comp{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.comp > div{border-radius:32px;padding:40px 36px}
.comp .ellos{background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.10)}
.comp .nos{background:var(--g);color:var(--ink)}
.comp h5{font-size:26px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.comp h4{font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1.08;margin-top:14px}
.comp ul{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:18px}
.comp li{display:flex;gap:14px;font-size:30px;font-weight:600;line-height:1.28}
.comp li svg{flex:none;margin-top:2px}
.comp .ellos li{color:rgba(255,255,255,.72)}
.light .comp .ellos{background:#fff;border-color:rgba(16,21,26,.08)}
.light .comp .ellos li{color:var(--m)}

/* dos columnas (requisitos pyme / personas) */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.col{border-radius:32px;padding:38px 34px;background:#fff;border:2px solid rgba(16,21,26,.08);box-shadow:0 20px 40px -28px rgba(16,21,26,.35)}
.col h4{display:flex;align-items:center;gap:14px;font-size:40px;font-weight:900;letter-spacing:-.03em}
.col h4 svg{color:var(--gd)}
.col ul{list-style:none;margin-top:24px;display:flex;flex-direction:column;gap:16px}
.col li{display:flex;gap:12px;font-size:29px;font-weight:600;line-height:1.28;color:var(--t)}
.col li svg{flex:none;color:var(--gd);margin-top:3px}

/* marcas de tarjeta */
.marcas{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.marca{background:var(--k);color:#fff;border-radius:30px;padding:36px 34px;font-size:40px;font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;gap:18px}
.marca svg{color:var(--gl)}

/* fotos: son horizontales, así que van enmarcadas como tarjeta */
.foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,14,13,0) 28%,rgba(11,14,13,.72) 58%,#0b0e0d 92%)}
.foto-card{position:relative;border-radius:36px;overflow:hidden;flex:none;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.foto-card img{display:block;width:100%;height:100%;object-fit:cover}
.foto-card .sello{position:absolute;left:24px;bottom:24px;display:inline-flex;align-items:center;gap:10px;font-size:24px;font-weight:800;padding:12px 18px;border-radius:999px;background:rgba(11,14,13,.78);color:#fff}
.foto-card .sello svg{color:var(--gl)}

/* el esquema de la marca: asesoría | efectiviza */
.rama{border-top:6px solid var(--g);display:grid;grid-template-columns:54% 46%}
.rama > div{padding-top:44px}
.rama > div + div{border-left:6px solid var(--gl);padding-left:44px}
.rama h3{font-size:62px;font-weight:900;letter-spacing:-.04em;line-height:1}
.rama .r2 h3{color:var(--gl)}
.rama .pills{display:flex;flex-direction:column;align-items:flex-start;gap:14px;margin-top:26px}
.rama .pills span{font-size:28px;font-weight:700;padding:12px 22px;border-radius:999px;background:#fff;color:var(--t)}
.rama .r2 .pills span{background:rgba(255,255,255,.08);color:#fff;border:2px solid rgba(255,255,255,.16)}

/* portadas de TikTok */
.tt-top{display:flex;justify-content:space-between;align-items:center}
.serie{display:inline-flex;align-items:center;gap:12px;font-size:25px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:14px 22px;border-radius:999px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.16)}
.serie svg{color:var(--g)}
.green .serie{background:var(--k);color:#fff;border-color:var(--k)} .green .serie svg{color:var(--gl)}
.light .serie{background:#fff;border-color:rgba(16,21,26,.12)} .light .serie svg{color:var(--gd)}
.ep{font-size:34px;font-weight:900;letter-spacing:-.02em;opacity:.45}
.tt-cuerpo{flex:1;display:flex;flex-direction:column;justify-content:center}
.tt-ico{width:240px;height:240px;border-radius:64px;display:grid;place-items:center;background:var(--g);color:var(--ink);box-shadow:0 30px 60px -30px rgba(34,197,94,.7)}
.light .tt-ico{background:var(--k);color:var(--gl)}
.numeral{font-size:560px;font-weight:900;letter-spacing:-.07em;line-height:.78;color:transparent;background:linear-gradient(180deg,#4ade80 0%,rgba(34,197,94,.06) 95%);-webkit-background-clip:text;background-clip:text}
.light .numeral{background-image:linear-gradient(180deg,#16a34a 0%,rgba(22,163,74,.06) 95%)}

/* destacados */
.hlc{position:absolute;left:50%;top:50%;width:620px;height:620px;margin:-310px 0 0 -310px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#2fd56b 0%,#22c55e 45%,#16a34a 100%);color:var(--ink);box-shadow:0 0 0 18px rgba(34,197,94,.12),0 0 140px rgba(34,197,94,.35)}

/* WhatsApp grande */
.wa-num{font-size:116px;font-weight:900;letter-spacing:-.04em;line-height:1}
.etiqueta{display:inline-flex;align-items:center;gap:14px;font-size:28px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gl)}

/* ---------- galería (?p=todo) ---------- */
.galeria{padding:40px;display:flex;flex-wrap:wrap;gap:34px;align-items:flex-start}
.galeria figure{color:#cfd8d3;font:600 14px/1.3 'Montserrat',sans-serif}
.galeria .marco{overflow:hidden;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.galeria figcaption{margin-top:10px}
.galeria h2{width:100%;color:#fff;font:800 22px 'Montserrat',sans-serif;margin-top:20px}
</style>
</head>

<script src="../js/config.js"></script>
<script>
(function () {
  "use strict";

  /* Usuario de las redes. Si @impulsacredito no está libre, cámbialo aquí
     y vuelve a exportar: se actualiza en todas las piezas. */
  var USUARIO = "@impulsacredito";

  var C = window.SITE_CONFIG || {};
  var P = C.platform || {};
  var K = C.contact || {};
  var PCT = Number(P.commissionPercent || 1);
  var MIN = Number(P.minAmount || 100), MAX = Number(P.maxAmount || 30000);
  var WA = K.whatsappDisplay || "983 808 849";
  var HORARIO = (K.hoursShort || ["Lunes a Sábado", "10:00 a.m. – 7:00 p.m."]);

  function soles(n, dec) {
    return "S/ " + Number(n).toLocaleString("es-PE", { minimumFractionDigits: dec ? 2 : 0, maximumFractionDigits: dec ? 2 : 0 });
  }
  function neto(m) { return Math.round((m - m * PCT / 100) * 100) / 100; }
  function comision(m) { return Math.round(m * PCT) / 100; }

  /* ---------- iconos (trazo, 24x24) ---------- */
  var I = {
    check: '<path d="M5 12.5l4.2 4.2L19 7"/>',
    x: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
    shield: '<path d="M12 21.5s7.5-3.8 7.5-9.6V5.2L12 2.5 4.5 5.2v6.7c0 5.8 7.5 9.6 7.5 9.6z"/><path d="M8.6 11.8l2.4 2.4 4.4-4.6"/>',
    id: '<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><circle cx="8.5" cy="11" r="2.2"/><path d="M5 16.2c.7-1.6 2-2.4 3.5-2.4s2.8.8 3.5 2.4M14.5 10h4M14.5 13.5h3"/>',
    card: '<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 9.5h19M6 15h4"/>',
    bank: '<path d="M3 9.5L12 4l9 5.5M5 10.5v6.5M9.5 10.5v6.5M14.5 10.5v6.5M19 10.5v6.5M3 20h18"/>',
    arrowR: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    arrowD: '<path d="M12 4.5v15M6 13.5l6 6 6-6"/>',
    bookmark: '<path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/>',
    calc: '<rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M8.5 6.5h7M8.5 11h.01M12 11h.01M15.5 11h.01M8.5 14.5h.01M12 14.5h.01M15.5 14.5h.01M8.5 18h.01M12 18h3.5"/>',
    question: '<circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.3a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.4-2.7 4"/><path d="M12 17.4h.01"/>',
    users: '<circle cx="9" cy="8.5" r="3.2"/><path d="M3 19.5c.8-3.2 3.2-5 6-5s5.2 1.8 6 5"/><path d="M16 5.5a3.2 3.2 0 0 1 0 6.1M17.6 14.7c1.8.6 3 2.3 3.4 4.8"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1-4 4-6 7.5-6s6.5 2 7.5 6"/>',
    store: '<path d="M3.5 9.5l1.6-5h13.8l1.6 5"/><path d="M3.5 9.5a2.8 2.8 0 0 0 5.7 0 2.8 2.8 0 0 0 5.6 0 2.8 2.8 0 0 0 5.7 0"/><path d="M5 12.2v8.3h14v-8.3"/><path d="M10 20.5v-5h4v5"/>',
    doc: '<path d="M14 2.5H6.5a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V8z"/><path d="M14 2.5V8h5.5"/><path d="M8.5 14.5l2.3 2.3 4.7-4.8"/>',
    folder: '<path d="M3 6.5a2 2 0 0 1 2-2h4.5l2 2.5H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M8 13.5h8"/>',
    flag: '<path d="M5 21.5V3.5"/><path d="M5 4h11.5l-2 4 2 4H5"/>',
    trend: '<path d="M3 17.5l6-6 4 4 8-8"/><path d="M15 7.5h6v6"/>',
    chat: '<path d="M20.5 12a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.2-4.2A8.5 8.5 0 1 1 20.5 12z"/>',
    alert: '<path d="M12 3.5l9.5 17h-19z"/><path d="M12 10v4.5M12 17.5h.01"/>',
    ruta: '<circle cx="6" cy="18.5" r="2.5"/><circle cx="18" cy="5.5" r="2.5"/><path d="M8.5 18.5H16a3.3 3.3 0 0 0 0-6.6H8a3.3 3.3 0 0 1 0-6.4h7.5"/>'
  };
  function ico(n, s, w) {
    return '<svg viewBox="0 0 24 24" width="' + (s || 32) + '" height="' + (s || 32) + '" fill="none" stroke="currentColor" stroke-width="' + (w || 2.2) + '" stroke-linecap="round" stroke-linejoin="round">' + I[n] + "</svg>";

        '<div class="nos"><h5>Con Impulsa</h5><h4>Se procesa como una compra</h4><ul>' +
          "<li>" + ico("check", 30, 2.8) + "Comisión de solo " + PCT + "%</li>" +

        "</ul></div>" +
      "</div>" +
      '<p class="mt-s" style="font-size:22px;font-weight:500;color:rgba(255,255,255,.5)">Las tasas y condiciones de pago de tu tarjeta las define tu banco.</p>' +
    "</div>" + firma("dark"));

  pieza("bc-foto", 1080, 1350, "dark", G_BANCO, "Efectiviza · Foto con mensaje",

    '<div class="velo"></div>' +

      '<div class="chips mt-m">' + chip("Visa") + chip("Mastercard") + chip("Amex") + chip("Diners") + "</div>" +
    "</div>" + firma("dark"));

  pieza("bc-whatsapp", 1080, 1350, "dark", G_BANCO, "Las dos líneas · Escríbenos",
    rombos() + agua("dark", -150, 170, 820) +
    '<div class="c">' +
      '<p class="eyebrow">Hablemos</p>' +
      '<h2 class="t t2 mt-m">Tu próximo paso está a un <span class="hl">mensaje</span></h2>' +

        '<span class="etiqueta">' + waIco(34) + "WhatsApp</span>" +
        '<p class="wa-num mt-s">' + WA + "</p>" +
        '<p class="lead mt-s" style="font-size:34px">' + HORARIO[0] + " · " + HORARIO[1] + "</p>" +
        '<span class="boton mt-m">Escríbenos ahora ' + ico("arrowR", 36, 2.8) + "</span>" +
      "</div>" +
    "</div>" + firma("dark"));

  /* ======================= INSTAGRAM · HISTORIAS ======================= */
  var G_HIST = "Instagram · Historias";
  pieza("story-01", 1080, 1920, "dark", G_HIST, "Historia · ¿Qué necesitas hoy? (encuesta)",
    agua("dark", -200, 500, 900) +
    '<div class="c">' +
      '<p class="eyebrow">Te ayudamos</p>' +
      '<h2 class="t t2 mt-m">¿Qué <span class="hl">necesitas</span> hoy?</h2>' +
      '<p class="lead mt-m">Vota aquí abajo y te escribimos con la opción que elijas.</p>' +
      '<div class="mt-l" style="color:var(--g)">' + ico("arrowD", 90, 2.4) + "</div>" +
    "</div>" + firma("dark"));

  pieza("story-02", 1080, 1920, "light", G_HIST, "Historia · Diagnóstico gratis (enlace)",
    '<div class="c">' +
      '<p class="eyebrow">Asesoría gratis</p>' +
      '<h2 class="t t2 mt-m">Diagnóstico <span class="hl">gratis</span> de tu crédito</h2>' +
      '<p class="lead mt-m">Cuéntanos cuánto necesitas y para qué. Te decimos qué opciones tienes, para tu negocio o para ti.</p>' +
      '<div class="auto" style="color:var(--gd);display:flex;align-items:center;gap:20px;font-size:34px;font-weight:800;margin-bottom:200px">' + ico("arrowD", 64, 2.6) + '<span style="color:var(--t)">Toca el enlace y empieza</span></div>' +
    "</div>" + firma("light"));

  pieza("story-03", 1080, 1920, "green", G_HIST, "Historia · Recordatorio de seguridad",
    '<div class="c mid">' +
      '<div style="width:170px;height:170px;border-radius:50px;background:var(--k);color:var(--gl);display:grid;place-items:center">' + ico("shield", 100, 1.8) + "</div>" +
      '<p class="eyebrow mt-l">Recordatorio</p>' +
      '<h2 class="t t2 mt-m">Nadie puede <span class="hl">garantizarte</span> un préstamo.</h2>' +
      '<p class="lead mt-m" style="font-weight:600">Desconfía de quien te cobre por adelantado para aprobarlo o te pida tu clave o tu CVV. Escríbenos solo al ' + WA + ".</p>" +
    "</div>" + firma("green"));

  pieza("story-04", 1080, 1920, "dark", G_HIST, "Historia · Efectiviza: mira cuánto recibes (enlace)",
    rombos(0.8) +
    '<div class="c">' +
      '<p class="eyebrow">Efectiviza en 10 segundos</p>' +
      '<h2 class="t t2 mt-m">Mira cuánto <span class="hl">recibes</span></h2>' +
      '<div class="caja mt-l" style="background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12)">' +
        '<div class="fila"><span>Si efectivizas</span><b>' + soles(1000) + "</b></div>" +
        '<div class="linea"></div>' +
        '<div class="recibes"><span>Recibes</span><b style="font-size:120px">' + soles(neto(1000)) + "</b></div>" +
      "</div>" +
      '<div class="auto" style="color:var(--g);display:flex;align-items:center;gap:20px;font-size:34px;font-weight:800;margin-bottom:200px">' + ico("arrowD", 64, 2.6) + '<span style="color:#fff">Toca el enlace y simula el tuyo</span></div>' +
    "</div>" + firma("dark"));

  /* ======================= INSTAGRAM · PORTADAS DE DESTACADOS ======================= */
  [["hl-credito", "Logra tu crédito", "doc"], ["hl-pyme", "Pyme", "store"], ["hl-personas", "Personas", "user"],
   ["hl-efectiviza", "Efectiviza", "card"], ["hl-seguro", "Seguridad", "shield"], ["hl-preguntas", "Preguntas", "question"],
   ["hl-clientes", "Clientes", "users"]
  ].forEach(function (d) {
    pieza(d[0], 1080, 1920, "dark", "Instagram · Portadas de destacados", "Destacado · " + d[1],
      '<div class="hlc">' + ico(d[2], 330, 1.6) + "</div>");
  });

  /* ======================= TIKTOK · PORTADAS =======================
     Igual que en Instagram: columna derecha verde (Efectiviza), las otras
     dos de Asesoría. Se publican de a tres: primero el de Efectiviza. */
  var G_TT = "TikTok · Portadas (columna derecha = Efectiviza)";
  function portadaTT(id, tema, nombre, ep, serie, icono, titulo, sub, extra) {
    extra = extra || {};
    var visual = "";
    if (extra.foto) visual = fotoCard(extra.foto, 560, extra.pos);
    if (extra.numeral) visual = '<div class="numeral">' + extra.numeral + "</div>";
    if (extra.icono) visual = '<div class="tt-ico">' + ico(extra.icono, 150, 1.8) + "</div>";
    pieza(id, 1080, 1920, tema, G_TT, nombre,
      (tema === "dark" ? rombos(1) : "") +
      (tema === "green" ? agua("light", -200, 1020, 760) : "") +
      '<div class="c" style="inset:300px 96px 420px 96px">' +
        '<div class="tt-top"><span class="serie">' + ico(icono, 30, 2.4) + serie + '</span><span class="ep">#' + ep + "</span></div>" +
        '<div class="tt-cuerpo">' + visual +
          '<h2 class="t t2' + (visual ? " mt-m" : "") + '" style="font-size:' + (extra.tam || (visual ? 104 : 124)) + 'px">' + titulo + "</h2>" +
          '<p class="lead mt-s" style="font-weight:700;font-size:42px">' + sub + "</p>" +
        "</div>" +
      "</div>" + firma(tema));
  }
  portadaTT("tt-01", "dark", "#01 · Asesoría: préstamo para tu negocio", "01", "Logra tu crédito · Pyme", "store",
    "¿Cómo sacar un préstamo para tu <span class=\"hl\">negocio</span>?", "Paso a paso, sin perder tiempo", { foto: "pago-pos.jpg", pos: "30% 40%", tam: 104 });
  portadaTT("tt-02", "light", "#02 · Asesoría: por qué te niegan un préstamo", "02", "Logra tu crédito", "doc",
    "razones por las que te <span class=\"hl\">niegan</span> un préstamo", "Y cómo evitarlas", { numeral: "3", tam: 104 });
  portadaTT("tt-03", "green", "#03 · Efectiviza: cuánto recibes", "03", "Efectiviza", "card",
    soles(1000) + " en tu tarjeta. ¿Cuánto <span class=\"hl\">recibes</span>?", "Spoiler: " + soles(neto(1000)));
  portadaTT("tt-04", "light", "#04 · Asesoría: banco, caja o financiera", "04", "Logra tu crédito · Personas", "user",
    "Préstamo personal: ¿banco, caja o <span class=\"hl\">financiera</span>?", "Compara la TCEA, no solo la tasa", { icono: "bank", tam: 104 });
  portadaTT("tt-05", "dark", "#05 · Asesoría: requisitos pyme", "05", "Logra tu crédito · Pyme", "store",
    "Lo que te piden para un préstamo <span class=\"hl\">pyme</span>", "Tenlo listo antes de ir", { foto: "hero-asesoria.jpg", pos: "50% 45%", tam: 104 });
  portadaTT("tt-06", "green", "#06 · Efectiviza: disposición vs. efectivizar", "06", "Efectiviza", "card",
    "Disposición de efectivo vs. <span class=\"hl\">efectivizar</span>", "No es lo mismo");
  portadaTT("tt-07", "dark", "#07 · Seguridad: cobro por adelantado", "07", "Que no te estafen", "alert",
    "Cobro por adelantado = <span class=\"hl\">estafa</span>", "Así operan los falsos gestores de préstamos", { icono: "alert" });
  portadaTT("tt-08", "light", "#08 · Asesoría: cuánto te pueden prestar", "08", "Logra tu crédito", "trend",
    "¿Cuánto te pueden <span class=\"hl\">prestar</span>?", "Lo que miran las entidades", { numeral: "S/?" });
  portadaTT("tt-09", "green", "#09 · Efectiviza: 4 pasos", "09", "Efectiviza", "card",
    "Tu tarjeta en efectivo en <span class=\"hl\">4 pasos</span>", "Sin ir al banco");

  /* ======================= RENDER ======================= */
  var raiz = document.getElementById("raiz");
  var pedido = (new URLSearchParams(location.search).get("p") || "todo").trim();

  function lienzo(p) {
    return '<div class="pz ' + p.tema + (p.h === 1920 ? " st" : "") + '" style="width:' + p.w + "px;height:" + p.h + 'px">' + p.html + "</div>";
  }

  if (pedido === "lista") {
    // exportar.ps1 lee esta lista para saber qué imágenes generar y de qué tamaño
    var pre = document.createElement("pre"); pre.id = "lista";
    pre.textContent = JSON.stringify(PIEZAS.map(function (x) { return { id: x.id, w: x.w, h: x.h }; }));
    raiz.appendChild(pre);
  } else if (pedido === "todo") {
    var html = '<div class="galeria">', grupo = "", esc = 0.3;
    PIEZAS.forEach(function (p) {
      if (p.grupo !== grupo) { grupo = p.grupo; html += "<h2>" + grupo + "</h2>"; }
      html += '<figure><div class="marco" style="width:' + p.w * esc + "px;height:" + p.h * esc + 'px"><div style="transform:scale(' + esc + ');transform-origin:0 0">' + lienzo(p) + "</div></div>" +
              "<figcaption>" + p.nombre + "<br><span style=\"opacity:.6\">" + p.id + " · " + p.w + "×" + p.h + "</span></figcaption></figure>";
    });
    raiz.innerHTML = html + "</div>";
  } else {
    var p = PIEZAS.find(function (x) { return x.id === pedido; });
    raiz.innerHTML = p ? lienzo(p) : '<p style="color:#fff;padding:40px;font:600 20px Montserrat">No existe la pieza «' + pedido + "».</p>";
  }
})();
</script>
